name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Add namespaces to legacy Android plugins
        shell: bash
        run: |
          set -euo pipefail
          for build_file in "$PUB_CACHE"/hosted/pub.dev/*/android/build.gradle; do
            [ -f "$build_file" ] || continue
            grep -q "com.android.library" "$build_file" || continue
            grep -q "namespace" "$build_file" && continue

            manifest="${build_file%build.gradle}src/main/AndroidManifest.xml"
            namespace=""
            if [ -f "$manifest" ]; then
              namespace="$(sed -n 's/.*package="\([^"]*\)".*/\1/p' "$manifest" | head -n 1)"
            fi

            if [ -n "$namespace" ]; then
              sed -i "/^[[:space:]]*android[[:space:]]*{/a\\    namespace '$namespace'" "$build_file"
              echo "Added namespace $namespace to $build_file"
            fi
          done

      - name: Align Android Java and Kotlin targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/android-jvm-target.gradle" <<'EOF'
          allprojects {
            afterEvaluate { project ->
              if (project.plugins.hasPlugin('com.android.application') ||
                  project.plugins.hasPlugin('com.android.library')) {
                project.android {
                  compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                  }
                }
              }

              project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions.jvmTarget = '17'
              }
            }
          }
          EOF

      - name: Analyze code
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: elkhalfy-musique-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Elkhalfy Musique v1.0.0"
          body: |
            ## 🎵 Elkhalfy Musique v1.0.0
            
            تطبيق موسيقى احترافي لنظام Android
            
            ### المميزات:
            - 🎵 عرض جميع الأغاني من الهاتف
            - 🔊 تشغيل في الخلفية (حتى مع إغلاق الشاشة)
            - 🔐 قفل التطبيق + إخفاء الأغاني بكود PIN
            - ⏰ مؤقت النوم (بمدة أو وقت محدد)
            - 📚 قوائم التشغيل، المفضلة، الألبومات
            - 🎨 تصميم احترافي داكن
            
            ### التثبيت:
            حمّل `app-release.apk` وثبّته على هاتفك مباشرة
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
